[package]
name = "cactor"
version = "7.0.0"
description = "High-performance Actor system for Cangjie - CActor 7.0 with 6-layer architecture"
cjc-version = "0.53.18"
output-type = "dynamic"

# === Foundation Layer ===
[package.package-configuration."cactor.foundation.memory"]
output-type = "static"

[package.package-configuration."cactor.foundation.queue"]
output-type = "static"

[package.package-configuration."cactor.foundation.serialization"]
output-type = "static"

[package.package-configuration."cactor.foundation.network"]
output-type = "static"

# === Core Layer ===
[package.package-configuration."cactor.core.actor"]
output-type = "static"

[package.package-configuration."cactor.core.message"]
output-type = "static"

[package.package-configuration."cactor.core.system"]
output-type = "static"

[package.package-configuration."cactor.core.supervision"]
output-type = "static"

[package.package-configuration."cactor.core.context"]
output-type = "static"

[package.package-configuration."cactor.core.config"]
output-type = "static"

# === Runtime Layer ===
[package.package-configuration."cactor.runtime.mailbox"]
output-type = "dynamic"

[package.package-configuration."cactor.runtime.dispatcher"]
output-type = "dynamic"

[package.package-configuration."cactor.runtime.scheduler"]
output-type = "dynamic"

[package.package-configuration."cactor.runtime.execution"]
output-type = "dynamic"

[package.package-configuration."cactor.runtime.system"]
output-type = "dynamic"

# === API Layer ===
[package.package-configuration."cactor.api"]
output-type = "static"

[package.package-configuration."cactor.api.config"]
output-type = "static"

[package.package-configuration."cactor.api.public"]
output-type = "static"

[package.package-configuration."cactor.api.extensions"]
output-type = "static"