[package]
name = "cactor"
version = "7.0.0"
description = "High-performance Actor system for Cangjie - CActor 7.0 with 6-layer architecture"
cjc-version = "0.53.18"
output-type = "dynamic"

# === Foundation Layer ===
[package.package-configuration."cactor.foundation.memory"]
output-type = "static"

[package.package-configuration."cactor.foundation.queue"]
output-type = "static"

[package.package-configuration."cactor.foundation.serialization"]
output-type = "static"

[package.package-configuration."cactor.foundation.network"]
output-type = "static"

# === Core Layer ===
[package.package-configuration."cactor.core.actor"]
output-type = "static"

[package.package-configuration."cactor.core.message"]
output-type = "static"

[package.package-configuration."cactor.core.system"]
output-type = "static"

[package.package-configuration."cactor.core.supervision"]
output-type = "static"

[package.package-configuration."cactor.core.context"]
output-type = "static"

# === API Layer ===
[package.package-configuration."cactor.api.public"]
output-type = "static"

# === 架构验证测试 ===
[package.package-configuration."cactor.integration.testing.architecture_test"]
output-type = "executable"

# === 简单架构测试 ===
[package.package-configuration."cactor.test_architecture"]
output-type = "executable"

# === 性能优化测试 ===
[package.package-configuration."cactor.integration.testing.performance_optimization_test"]
output-type = "executable"

# === 内存优化测试 ===
[package.package-configuration."cactor.integration.testing.memory_optimization_test"]
output-type = "executable"

# === 无锁队列性能基准测试 ===
[package.package-configuration."cactor.integration.testing.lockfree_queue_benchmark"]
output-type = "executable"

# === 无锁队列多线程性能基准测试 ===
[package.package-configuration."cactor.integration.testing.lockfree_queue_multithread_benchmark"]
output-type = "executable"

# === 优化队列性能基准测试 ===
[package.package-configuration."cactor.integration.testing.optimized_queue_benchmark"]
output-type = "executable"

# === Plan7综合功能验证测试 ===
[package.package-configuration."cactor.integration.testing.plan7_comprehensive_test"]
output-type = "executable"
